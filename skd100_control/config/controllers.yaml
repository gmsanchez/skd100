controller_manager:
  ros__parameters:
    update_rate: 20 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    skd_base_controller:
      type: diff_drive_controller/DiffDriveController

skd_base_controller:
  ros__parameters:

    left_wheel_names: ['front_left_wheel_joint', 'rear_left_wheel_joint']
    right_wheel_names: ['front_right_wheel_joint', 'rear_right_wheel_joint']

    wheel_separation: 0.475   # 47.5 cm wheel separation
    wheel_radius: 0.08        # 16 cm wheel diameter

    wheel_separation_multiplier: 1.0

    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Feedback from motors is published at around 20 Hz
    publish_rate: 20.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Whether to use feedback or commands for odometry calculations
    open_loop: false
    # Update odometry from velocity
    position_feedback: false
    # velocity computation filtering
    velocity_rolling_window_size: 1

    enable_odom_tf: false

    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    publish_cmd : true
    use_stamped_vel: true

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear:
      x:
        has_velocity_limits: true
        has_acceleration_limits: true
        ### top speed is around 0.5 m/s
        max_velocity: 0.45 # m/s

        max_acceleration: 1.0 # m/s^2
        max_jerk: NAN # m/s^3

    angular:
      z:
        has_velocity_limits: true
        has_acceleration_limits: true
        ### top angular speed is around 2.36 rad/s
        max_velocity: 2.0 # rad/s
        
        max_acceleration: 3.0 # rad/s^2
        max_jerk: NAN # rad/s^3
